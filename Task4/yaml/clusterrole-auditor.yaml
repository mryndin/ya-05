--- 
apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRole 
metadata: 
  name: propdev-auditor 
  labels: 
    app: propdevelopment 
rules: 
- apiGroups: [""] 
  resources: ["pods", "services", "configmaps", "events", "namespaces"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: ["apps"] 
  resources: ["deployments", "replicasets", "statefulsets"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: [""] 
  resources: ["secrets"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: ["audit.k8s.io"] 
  resources: ["events"] 
  verbs: ["get", "list", "watch"] 
