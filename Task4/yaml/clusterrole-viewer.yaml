--- 
apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRole 
metadata: 
  name: propdev-viewer 
  labels: 
    app: propdevelopment 
rules: 
- apiGroups: [""] 
  resources: ["pods", "services", "configmaps", "events", "namespaces"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: ["apps"] 
  resources: ["deployments", "replicasets", "statefulsets"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: ["batch"] 
  resources: ["jobs", "cronjobs"] 
  verbs: ["get", "list", "watch"] 
- apiGroups: [""] 
  resources: ["pods/log"] 
  verbs: ["get", "list"] 
